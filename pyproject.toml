[project]
name = "ts-haystack"
version = "0.1.0"
description = "TS-Haystack: A Multi-Task Retrieval Benchmark for Long-Context Time-Series Reasoning"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = []
keywords = [
    "time-series",
    "large-language-models",
    "long-context",
    "retrieval",
    "multimodal",
    "healthcare"
]

dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "torch>=2.0",
  "tqdm>=4.62",
  "scikit-learn>=1.0",
  "transformers>=4.51",
  "huggingface-hub>=0.16",
  "datasets>=2.0",
  "peft>=0.4",
  "requests>=2.28",
  "einops>=0.6",
  "chronos-forecasting>=1.4",
  "timesfm[torch]>=1.0",
  "h5py>=3.0",
  "wfdb>=4.0",
  "open-flamingo>=0.0.2",
  "polars>=1.0",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "wandb>=0.15",
  "matplotlib>=3.3",
  "seaborn>=0.13",
  "nltk>=3.8",
  "rouge-score>=0.1.2",
  "boto3>=1.28",
  "kaggle>=2.1.0",
  "kagglehub>=1.0.1",
]

[dependency-groups]
dev = [
    "reuse>=6.2.0",
    "ruff>=0.14.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

llm = [
  "google-genai>=1.59.0",
  "openai>=1.0",
]

anthropic = [
  "anthropic[bedrock]>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
required-version = ">=0.9"
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
markers = [
    "integration: slow end-to-end training smoke tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 120
target-version = "py312"
