global:
  seed: 42
  n_jobs: 4
  output_dir: data/uk_dale/uk_dale_haystack/tasks
  source_hz: 0.166667    # 1/6 Hz
  dt_s: 6.0
context_lengths_seconds: [900, 3600, 7200, 32400, 86400]
samples:
  train: 1000
  validation: 150
  test: 150
allow_cross_house: false
tasks:
  existence:            { enabled: true,  min_other_bouts_in_bg: 0 }
  localization:         { enabled: true }
  counting:             { enabled: true }
  ordering:             { enabled: true }
  antecedent:           { enabled: true }
  comparison:           { enabled: true }
  multi_hop:            { enabled: true }
  state_query:          { enabled: true }
  anomaly_detection:    { enabled: true }
  anomaly_localization: { enabled: true }
