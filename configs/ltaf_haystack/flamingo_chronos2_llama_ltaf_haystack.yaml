# Flamingo + Chronos-2 + Llama-3.2-1B on LTAF-Haystack (rhythms)
# All context lengths (100s, 900s, 3600s, 7200s) trained together (no curriculum).
#
# Mirrors configs/sleep_psg/flamingo_chronos2_llama_sleep_psg_stages.yaml.
# Samples live at data/ltafdb/ltaf_haystack/rhythms/tasks/, so base_dir is
# passed explicitly (qa_loader default points at .../ltaf_haystack/tasks/).
#
# Usage: .venv/bin/python3 main.py --config configs/ltaf_haystack/flamingo_chronos2_llama_ltaf_haystack.yaml

name: flamingo_chronos2_llama_ltaf_haystack_fixed
seed: 42

dataset:
  name: ltaf_haystack
  extra_kwargs:
    tasks: ["all"]
    context_lengths_seconds: ["all"]
    base_dir: data/ltafdb/ltaf_haystack/rhythms/tasks

model:
  architecture: flamingo
  encoder:
    type: chronos2
    model_id: amazon/chronos-2
    freeze: true
  projector:
    type: perceiver_resampler
    num_latents: 64
  extra_kwargs:
    cross_attn_every_n_layers: 1
    freeze_lm_embeddings: false

backbone:
  name: llama
  model_id: meta-llama/Llama-3.2-1B-Instruct

training:
  backbone_training: freeze
  batch_size: 2
  num_epochs: 5
  learning_rate:
    default: 2.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  optimizer:
    type: adamw
  early_stopping:
    enabled: true
    patience: 3
    metric: val_loss
    mode: min
  logging:
    log_every_n_steps: 10
    wandb:
      enabled: true
      project: ts-haystack-ltaf
  checkpointing:
    save_every_n_steps: 10000
    save_best: true
    metric: val_loss
    mode: min
  dataloader:
    num_workers: 4
    prefetch_factor: 4
    pin_memory: true

runtime:
  output_dir: results
  run_name: flamingo_ltaf_haystack_fixed
