# Paper run — ITFormer + Chronos-2 + Llama-3.2-1B on Sleep PSG (arousals)

name: itformer_chronos2_llama_sleep_psg_arousals
seed: 42

dataset:
  name: sleep_psg_haystack
  extra_kwargs:
    label_class: arousals
    tasks: ["all"]
    context_lengths_seconds: ["all"]

model:
  architecture: itformer
  encoder:
    type: chronos2
    model_id: amazon/chronos-2
    freeze: true
    multi_variable: true
  extra_kwargs:
    it_d_model: 2048
    it_n_heads: 16
    it_layers: 2
    it_dropout: 0.1
    prefix_num: 25
    freeze_ts_encoder: true

backbone:
  name: llama
  model_id: meta-llama/Llama-3.2-1B-Instruct

training:
  backbone_training: freeze
  batch_size: 2
  num_epochs: 5
  learning_rate:
    default: 2.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  optimizer:
    type: adamw
  early_stopping:
    enabled: true
    patience: 3
    metric: val_loss
    mode: min
  logging:
    log_every_n_steps: 10
    wandb:
      enabled: true
      project: anon-tslm-paper
  checkpointing:
    save_every_n_steps: 0
    save_best: true
    metric: val_loss
    mode: min
  dataloader:
    num_workers: 4
    prefetch_factor: 4
    pin_memory: true
  eval_max_new_tokens: 500

runtime:
  output_dir: results
  run_name: itformer_sleep_psg_arousals
  eval_samples_ratio: 0.1
