# Paper run — ChatTime + Llama-3.2-1B on TS-Haystack (Capture24 accelerometer, CoT)

name: chattime_llama_capture24_haystack_cot
seed: 42

dataset:
  name: capture24_haystack_cot
  extra_kwargs:
    tasks: ["all"]
    # ChatTime-specific cap: 100Hz × 3 accel axes => ~300 tokens/sec
    # when serialized, so bins above ~400s exceed Llama-3.2's 128K
    # position limit. 100s -> ~30K tokens fits with headroom.
    context_lengths_seconds: [2.56, 10, 100]

model:
  architecture: chattime
  extra_kwargs:
    n_tokens: 10002
    precision: 4
    train_embeddings: true
    max_seq_length: 131072

backbone:
  name: llama
  model_id: meta-llama/Llama-3.2-1B-Instruct

training:
  backbone_training: lora
  batch_size: 1
  num_epochs: 5
  learning_rate:
    default: 2.0e-4
    embeddings: 2.0e-4
  lora:
    r: 16
    alpha: 16
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  optimizer:
    type: adamw
  early_stopping:
    enabled: true
    patience: 3
    metric: val_loss
    mode: min
  logging:
    log_every_n_steps: 10
    wandb:
      enabled: true
      project: anon-tslm-paper
  checkpointing:
    save_every_n_steps: 0
    save_best: true
    metric: val_loss
    mode: min
  dataloader:
    num_workers: 2
    prefetch_factor: 2
    pin_memory: true
  eval_max_new_tokens: 500

runtime:
  output_dir: results
  run_name: chattime_capture24_haystack_cot
  eval_samples_ratio: 0.1
