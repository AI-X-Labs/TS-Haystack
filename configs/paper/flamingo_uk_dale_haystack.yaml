# Paper run -- Flamingo + Chronos-2 + Llama-3.2-1B on UK-DALE-Haystack
# Mirrors flamingo_ts_haystack_cot.yaml: frozen Chronos-2 encoder,
# perceiver_resampler projector (64 latents), frozen Llama-3.2-1B,
# LR 2e-4. UK-DALE is single-channel mains so Chronos-2 runs in
# univariate mode (multi_variable defaults to false).

name: flamingo_chronos2_llama_uk_dale_haystack
seed: 42

dataset:
  name: uk_dale_haystack
  data_dir: data
  split: train
  extra_kwargs:
    tasks: ["all"]
    context_lengths_seconds: ["all"]
    base_dir: data/uk_dale/uk_dale_haystack/tasks

model:
  architecture: flamingo
  encoder:
    type: chronos2
    model_id: amazon/chronos-2
    freeze: true
  projector:
    type: perceiver_resampler
    num_latents: 64
  extra_kwargs:
    cross_attn_every_n_layers: 1
    freeze_lm_embeddings: false

backbone:
  name: llama
  model_id: meta-llama/Llama-3.2-1B-Instruct

training:
  backbone_training: freeze
  batch_size: 2
  num_epochs: 5
  learning_rate:
    default: 2.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  optimizer:
    type: adamw
  early_stopping:
    enabled: true
    patience: 3
    metric: val_loss
    mode: min
  logging:
    log_every_n_steps: 10
    wandb:
      enabled: true
      project: anon-tslm-paper
  checkpointing:
    save_every_n_steps: 0
    save_best: true
    metric: val_loss
    mode: min
  dataloader:
    num_workers: 4
    prefetch_factor: 4
    pin_memory: true
  eval_max_new_tokens: 500

runtime:
  output_dir: results
  run_name: flamingo_uk_dale_haystack
  eval_samples_ratio: 0.1
