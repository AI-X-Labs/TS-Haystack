# Paper run — ChatTS (original paper setup) + Llama-3.2-1B on Sleep PSG (arousals)

name: chatts_llama_sleep_psg_arousals
seed: 42

dataset:
  name: sleep_psg_haystack
  extra_kwargs:
    label_class: arousals
    tasks: ["all"]
    context_lengths_seconds: ["all"]

model:
  architecture: chatts
  encoder:
    type: mlp_encoder
    patch_size: 20
    num_layers: 3
    hidden_size: 2048
    num_features: 2
    max_sequence_length: 1024
  extra_kwargs:
    encoding_method: sp
    freeze_ts_encoder: false
    freeze_lm_embeddings: false

backbone:
  name: llama
  model_id: meta-llama/Llama-3.2-1B-Instruct

training:
  backbone_training: freeze
  batch_size: 2
  num_epochs: 5
  learning_rate:
    default: 2.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  optimizer:
    type: adamw
  early_stopping:
    enabled: true
    patience: 3
    metric: val_loss
    mode: min
  logging:
    log_every_n_steps: 10
    wandb:
      enabled: true
      project: anon-tslm-paper
  checkpointing:
    save_every_n_steps: 0
    save_best: true
    metric: val_loss
    mode: min
  dataloader:
    num_workers: 4
    prefetch_factor: 4
    pin_memory: true
  eval_max_new_tokens: 500

runtime:
  output_dir: results
  run_name: chatts_sleep_psg_arousals
  eval_samples_ratio: 0.1
