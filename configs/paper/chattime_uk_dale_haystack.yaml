# Paper run -- ChatTime + Llama-3.2-1B on UK-DALE-Haystack
# Pure-LLM TSLM: discretize each 6 s power sample into a bin token, serialize
# as text. Same LoRA recipe as chattime_ltaf_haystack.yaml.
# UK-DALE has 6 s sampling, so ctx 86400s -> 14400 samples ~= 86k tokens
# (still within Llama-3.2's 128K position limit, but tight after the prompt
# scaffold). The orchestrator's OOM fallback drops the largest ctx if needed.

name: chattime_llama_uk_dale_haystack
seed: 42

dataset:
  name: uk_dale_haystack
  data_dir: data
  split: train
  extra_kwargs:
    tasks: ["all"]
    # Cap below the 128K limit; 86400s would tip the prompt+TS over once
    # tokenization overhead is included. Re-add if measured to fit.
    context_lengths_seconds: [900, 3600, 7200, 32400]
    base_dir: data/uk_dale/uk_dale_haystack/tasks

model:
  architecture: chattime
  extra_kwargs:
    n_tokens: 10002
    precision: 4
    train_embeddings: true
    max_seq_length: 131072

backbone:
  name: llama
  model_id: meta-llama/Llama-3.2-1B-Instruct

training:
  backbone_training: lora
  batch_size: 1
  num_epochs: 5
  learning_rate:
    default: 2.0e-4
    embeddings: 2.0e-4
  lora:
    r: 16
    alpha: 16
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  optimizer:
    type: adamw
  early_stopping:
    enabled: true
    patience: 3
    metric: val_loss
    mode: min
  logging:
    log_every_n_steps: 10
    wandb:
      enabled: true
      project: anon-tslm-paper
  checkpointing:
    save_every_n_steps: 0
    save_best: true
    metric: val_loss
    mode: min
  dataloader:
    num_workers: 2
    prefetch_factor: 2
    pin_memory: true
  eval_max_new_tokens: 500

runtime:
  output_dir: results
  run_name: chattime_uk_dale_haystack
  eval_samples_ratio: 0.1
