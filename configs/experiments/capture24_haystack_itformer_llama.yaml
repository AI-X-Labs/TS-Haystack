# ITFormer + Chronos-2 encoder + TS-Haystack CoT + Qwen3-0.6B
# QA with chain-of-thought on TS-Haystack, context lengths up to 100s (inclusive).
# 100s at 100Hz = 10,000 samples per axis (3 accelerometer axes).
#
# Usage: .venv/bin/python3 main.py --config configs/experiments/capture24_haystack_itformer_llama.yaml

name: capture24_haystack_itformer_llama
seed: 42

# ------------------------------------------------------------------------------
# Dataset Configuration
# ------------------------------------------------------------------------------
dataset:
  name: capture24_haystack_cot
  data_dir: data/capture24/ts_haystack/tasks
  extra_kwargs:
    tasks: all
    context_lengths_seconds: [2.56, 10, 100]

# ------------------------------------------------------------------------------
# Model Configuration (ITFormer with Chronos-2 encoder)
# ------------------------------------------------------------------------------
model:
  architecture: itformer

  encoder:
    type: chronos2
    model_id: amazon/chronos-2
    freeze: true
    multi_variable: true

  extra_kwargs:
    it_d_model: 896
    it_n_heads: 16
    it_layers: 2
    it_dropout: 0.1
    prefix_num: 25
    freeze_ts_encoder: true

# ------------------------------------------------------------------------------
# Backbone Configuration
# ------------------------------------------------------------------------------
backbone:
  name: llama
  model_id: meta-llama/Llama-3.2-1B-Instruct

# ------------------------------------------------------------------------------
# Training Configuration
# ------------------------------------------------------------------------------
training:
  backbone_training: freeze
  batch_size: 2
  num_epochs: 50

  learning_rate:
    default: 5.0e-5

  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.03

  optimizer:
    type: adamw

  early_stopping:
    enabled: true
    patience: 5
    metric: val_loss
    mode: min

  logging:
    log_every_n_steps: 10
    eval_every_n_steps: 100
    wandb:
      enabled: true
      project: ts-haystack-tsalm

  checkpointing:
    save_every_n_steps: 10000
    save_best: true
    metric: val_loss
    mode: min

  dataloader:
    num_workers: 2
    prefetch_factor: 2
    pin_memory: true

# ------------------------------------------------------------------------------
# Runtime Configuration
# ------------------------------------------------------------------------------
runtime:
  output_dir: results
  run_name: capture24_haystack_itformer_llama